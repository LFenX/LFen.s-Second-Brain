server {
    listen 80;
    server_name _;
    root /ragflow/web/dist;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 9;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # The managed bearer endpoint never persists request bodies or URLs.
    location = /api/v1/knowledge/access/mcp {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:9380;
        include proxy.conf;
        proxy_request_buffering off;
        access_log off;
    }

    location ~ ^/api/v1/admin {
        proxy_pass http://127.0.0.1:9381;
        include proxy.conf;
    }

    # Keep original bytes out of proxy request buffering and gzip transforms.
    location ~ "^/api/v1/datasets/[0-9a-f]{32}/knowledge/(original-registrations/[0-9a-f]{32}/uploads/[0-9a-f]{32}/content|original-revisions/[0-9a-f]{32}/content)$" {
        client_max_body_size 64m;
        client_body_timeout 120s;
        proxy_pass http://127.0.0.1:9380;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 135s;
        proxy_send_timeout 135s;
        gzip off;
    }

    # The Go adapter enforces the 2MiB capture bound and returns the C2 error.
    location ~ "^/api/v1/datasets/[0-9a-f]{32}/knowledge/(web-registrations/[0-9a-f]{32}/captures/[0-9a-f]{32}/(content|observation/entries/[0-9a-f]{64}/representations/(decoded_content|safe_reading)/content)|web-revisions/[0-9a-f]{32}/(capture/content|representations/(decoded_content|safe_reading)/content))$" {
        client_max_body_size 3m;
        client_body_timeout 30s;
        proxy_pass http://127.0.0.1:9380;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        gzip off;
    }

    location ~ ^/api/v1 {
        proxy_pass http://127.0.0.1:9380;
        include proxy.conf;
    }


    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        # The entry document must never come from cache: a stale index.html
        # references hashed bundles that no longer exist after an image
        # upgrade.
        add_header Cache-Control "no-store";
    }

    # Direct navigation to the chunk routes must reach the SPA fallback:
    # without this block those paths match the hashed-asset location below,
    # and a missing file answers 404 instead of the app shell. Regex
    # locations are matched in order, so this must come first.
    location ~ ^/chunk/(parsed/chunks|chunk/[^/]+|result/[^/]+)$ {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles are immutable, so they may cache for a year, and a stale
    # reference after an upgrade must answer 404 instead of the SPA fallback
    # HTML, which a dynamic import() cannot parse.
    location ~ ^/(chunk|entry|assets)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }
}
